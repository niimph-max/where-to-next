# Vela — บิลด์ iOS จาก Windows โดยไม่ต้องมี Mac
# วางไฟล์นี้ที่ราก repo (ระดับเดียวกับ index.html) แล้วต่อ repo เข้า codemagic.io
# ฟรี 500 นาที/เดือน — บิลด์ iOS หนึ่งครั้งกินราว 8-14 นาที

workflows:
  android-test:
    name: Vela Android · APK ทดสอบ
    instance_type: linux_x2
    max_build_duration: 40
    environment:
      java: 17
      node: 20
    scripts:
      - name: เช็คว่ามีตัวเว็บอยู่จริง
        script: |
          cd capacitor
          if [ ! -f "www/index.html" ]; then
            echo "❌ ไม่พบ capacitor/www/index.html"
            exit 1
          fi
      - name: ติดตั้ง dependencies
        script: |
          cd capacitor
          npm ci || npm install
      - name: เตรียม Android platform
        script: |
          cd capacitor
          npx cap add android 2>/dev/null || true
          npx cap sync android
      - name: สร้างไอคอน + สปแลชจาก assets/
        script: |
          cd capacitor
          npx --yes @capacitor/assets@3 generate --android
      - name: บิลด์ APK
        script: |
          cd capacitor/android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - capacitor/android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - admin@onevela.net
        notify:
          success: true
          failure: true
  ios-release:
    name: Vela iOS · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    # บิลด์อัตโนมัติเมื่อ push เข้า main (ตั้ง 12 ต.ค. 2569) — แต่เฉพาะคอมมิตที่แตะ capacitor/www/ เท่านั้น
    # แก้เว็บอย่างเดียว (app/) จะไม่บิลด์ ไม่เปลืองนาที — ตามนโยบาย "ไม่ต้อง sync native ทุกครั้งที่แก้เว็บ"
    # ⚠ ต้องเปิด webhook ใน Codemagic ด้วย ไม่งั้นบล็อกนี้ไม่มีผล (กด Start new build เองได้เสมอ)
    # ⚠ ซิงก์ www รอบใหม่หลังเวอร์ชันเก่าถูกปล่อยแล้ว ต้องขยับ VELA_VERSION ในคอมมิตเดียวกัน
    #   ไม่งั้นบิลด์ผ่านแต่ publish ล้ม (iris-code 90186 · train closed) เสียนาทีไปฟรี
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - 'capacitor/www/**'
    # ชื่อ key ต้องตรงกับที่ตั้งไว้ใน Codemagic UI (Teams > Integrations > App Store Connect)
    integrations:
      app_store_connect: Vela ASC
    environment:
      # ⚠ ปักรุ่นไว้ (12 ต.ค. 2569) — เดิม latest แล้วบิลด์ค้าง queued นานผิดปกติ
      #   Codemagic ตอบ ticket #22003: เครื่องของ Xcode รุ่นล่าสุดคนแย่งเยอะ แนะนำให้เปลี่ยนรุ่น
      #   ⚠ latest = 26.6 = กลุ่มเครื่องเดียวกัน (David ยืนยัน) — กลุ่มนี้คนแย่งเยอะที่สุด ลอง 26.6 แล้วยังค้าง
      #   26.5 = กลุ่มเครื่องคนละกลุ่ม รุ่นใกล้กันสุด · Apple รับบิลด์จาก Xcode 26 อยู่
      #   คิวโล่งเมื่อไหร่จะกลับไป latest ก็ได้
      xcode: "26.5"
      cocoapods: default
      node: 20
      groups:
        - appstore
      vars:
        XCODE_WORKSPACE: "capacitor/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "net.onevela.app"
        VELA_VERSION: "1.0.11"
      # ไม่ใช้ ios_signing เพราะมันหา profile ที่มีอยู่เดิมเท่านั้น — เราสร้างเองในสคริปต์ข้างล่าง
    scripts:
      - name: เช็คว่ามีตัวเว็บอยู่จริง
        script: |
          cd capacitor
          if [ ! -f "www/index.html" ]; then
            echo "❌ ไม่พบ capacitor/www/index.html — ต้องก็อปตัวแอปลง capacitor/www ก่อน push"
            exit 1
          fi
          echo "✅ พบ www/index.html ($(wc -c < www/index.html) bytes)"
      - name: ติดตั้ง dependencies
        script: |
          cd capacitor
          npm ci || npm install
      - name: เตรียม iOS platform
        script: |
          cd capacitor
          # ถ้าโฟลเดอร์ ios มีแต่ไม่มี xcodeproj (กรณี commit มาไม่ครบ) ให้สร้างใหม่
          # แต่เก็บไอคอน/สแปลช/AppDelegate ที่คัสตอมไว้
          if [ ! -f "ios/App/App.xcodeproj/project.pbxproj" ]; then
            echo "ℹ️ ไม่พบ xcodeproj — สร้าง iOS platform ใหม่"
            rm -rf /tmp/ios-keep && mkdir -p /tmp/ios-keep
            [ -d "ios/App/App/Assets.xcassets" ] && cp -R ios/App/App/Assets.xcassets /tmp/ios-keep/
            [ -f "ios/App/App/AppDelegate.swift" ] && cp ios/App/App/AppDelegate.swift /tmp/ios-keep/
            rm -rf ios
            npx cap add ios
            if [ -d "/tmp/ios-keep/Assets.xcassets" ]; then
              rm -rf ios/App/App/Assets.xcassets
              cp -R /tmp/ios-keep/Assets.xcassets ios/App/App/
              echo "✅ คืนไอคอน/สแปลชเดิม"
            fi
            if [ -f "/tmp/ios-keep/AppDelegate.swift" ]; then
              cp /tmp/ios-keep/AppDelegate.swift ios/App/App/AppDelegate.swift
              echo "✅ คืน AppDelegate.swift เดิม"
            fi
          fi
          npx cap sync ios
      - name: สร้างไอคอน + สปแลชจาก assets/ (ไม่งั้นสปแลชเป็นโลโก้ Capacitor)
        script: |
          cd capacitor
          npx --yes @capacitor/assets@3 generate --ios
      - name: ตั้งค่า Info.plist (export compliance + คำขออนุญาต)
        script: |
          PLIST=capacitor/ios/App/App/Info.plist
          plutil -replace ITSAppUsesNonExemptEncryption -bool NO "$PLIST"
          plutil -replace NSPhotoLibraryUsageDescription -string "ใช้เลือกรูปจากคลังภาพเพื่อแนบในบันทึกทริปของคุณ" "$PLIST"
          plutil -replace NSPhotoLibraryAddUsageDescription -string "ใช้บันทึกรูปที่สร้างจากแอปลงคลังภาพของคุณ" "$PLIST"
          plutil -replace NSCameraUsageDescription -string "ใช้ถ่ายรูปเพื่อแนบในบันทึกทริปของคุณ" "$PLIST"
          plutil -replace NSLocationWhenInUseUsageDescription -string "ใช้ระบุตำแหน่งเพื่อเช็คอินสถานที่ในทริปของคุณ" "$PLIST"
          plutil -p "$PLIST" | grep -E "ITSApp|UsageDescription"
      - name: ยกระดับ minimum iOS เป็น 15.0 (แก้ ITMS-90068)
        script: |
          cd capacitor/ios/App
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/" Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" App.xcodeproj/project.pbxproj
          grep -n "platform :ios" Podfile
      - name: pod install
        script: |
          cd capacitor/ios/App
          rm -rf Pods Podfile.lock
          pod install --repo-update
          echo "— ปลั๊กอินที่ลงจริง —"
          grep -i "capacitor" Podfile.lock | sort -u
      - name: เตรียม keychain
        script: keychain initialize
      - name: สร้าง/ดึง signing files (สร้าง cert + profile ให้เองถ้ายังไม่มี)
        script: |
          if [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "✅ ใช้ private key เดิมจาก env var"
            printf '%s' "$CERTIFICATE_PRIVATE_KEY" > /tmp/cert_key.pem
          else
            echo "ℹ️ ยังไม่มี CERTIFICATE_PRIVATE_KEY — สร้างใหม่"
            openssl genrsa -out /tmp/cert_key.pem 2048
            echo ""
            echo "==================== คัดลอกคีย์ข้างล่างนี้ ===================="
            echo "เอาไปใส่เป็น env var ชื่อ CERTIFICATE_PRIVATE_KEY (ติ๊ก Secure, group appstore)"
            echo "เพื่อให้บิลด์ครั้งต่อไปใช้ certificate เดิม ไม่สร้างใหม่ทุกรอบ"
            echo "=============================================================="
            cat /tmp/cert_key.pem
            echo "=============================================================="
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
      - name: ใส่ cert เข้า keychain
        script: keychain add-certificates
      - name: ตั้ง build number
        script: |
          cd capacitor/ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          [ -z "$LATEST" ] && LATEST=0
          agvtool new-version -all $((LATEST + 1)) || echo "⚠️ ตั้ง build number ไม่สำเร็จ — ใช้ค่าเดิม"
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $VELA_VERSION;/g" App.xcodeproj/project.pbxproj
          grep -m1 MARKETING_VERSION App.xcodeproj/project.pbxproj

      - name: บิลด์ ipa
        script: |
          cd capacitor/ios/App
          xcode-project use-profiles
          xcode-project build-ipa --workspace "App.xcworkspace" --scheme "App"
    artifacts:
      - capacitor/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # เปิดบรรทัดล่างเมื่อพร้อมส่งขึ้นขายจริง
        # submit_to_app_store: false
      email:
        recipients:
          - admin@onevela.net
        notify:
          success: true
          failure: true
