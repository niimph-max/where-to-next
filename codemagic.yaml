# Vela — บิลด์ iOS จาก Windows โดยไม่ต้องมี Mac
# วางไฟล์นี้ที่ราก repo (ระดับเดียวกับ index.html) แล้วต่อ repo เข้า codemagic.io
# ฟรี 500 นาที/เดือน — บิลด์ iOS หนึ่งครั้งกินราว 8-14 นาที

workflows:
  ios-release:
    name: Vela iOS · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    # ชื่อ key ต้องตรงกับที่ตั้งไว้ใน Codemagic UI (Teams > Integrations > App Store Connect)
    integrations:
      app_store_connect: Vela ASC
    environment:
      xcode: latest
      cocoapods: default
      node: 20
      groups:
        - appstore
      vars:
        XCODE_WORKSPACE: "capacitor/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "net.onevela.app"
      # ไม่ใช้ ios_signing เพราะมันหา profile ที่มีอยู่เดิมเท่านั้น — เราสร้างเองในสคริปต์ข้างล่าง
    scripts:
      - name: เช็คว่ามีตัวเว็บอยู่จริง
        script: |
          cd capacitor
          if [ ! -f "www/index.html" ]; then
            echo "❌ ไม่พบ capacitor/www/index.html — ต้องก็อปตัวแอปลง capacitor/www ก่อน push"
            exit 1
          fi
          echo "✅ พบ www/index.html ($(wc -c < www/index.html) bytes)"
      - name: ติดตั้ง dependencies
        script: |
          cd capacitor
          npm ci || npm install
      - name: เตรียม iOS platform
        script: |
          cd capacitor
          # ถ้าโฟลเดอร์ ios มีแต่ไม่มี xcodeproj (กรณี commit มาไม่ครบ) ให้สร้างใหม่
          # แต่เก็บไอคอน/สแปลช/AppDelegate ที่คัสตอมไว้
          if [ ! -f "ios/App/App.xcodeproj/project.pbxproj" ]; then
            echo "ℹ️ ไม่พบ xcodeproj — สร้าง iOS platform ใหม่"
            rm -rf /tmp/ios-keep && mkdir -p /tmp/ios-keep
            [ -d "ios/App/App/Assets.xcassets" ] && cp -R ios/App/App/Assets.xcassets /tmp/ios-keep/
            [ -f "ios/App/App/AppDelegate.swift" ] && cp ios/App/App/AppDelegate.swift /tmp/ios-keep/
            rm -rf ios
            npx cap add ios
            if [ -d "/tmp/ios-keep/Assets.xcassets" ]; then
              rm -rf ios/App/App/Assets.xcassets
              cp -R /tmp/ios-keep/Assets.xcassets ios/App/App/
              echo "✅ คืนไอคอน/สแปลชเดิม"
            fi
            if [ -f "/tmp/ios-keep/AppDelegate.swift" ]; then
              cp /tmp/ios-keep/AppDelegate.swift ios/App/App/AppDelegate.swift
              echo "✅ คืน AppDelegate.swift เดิม"
            fi
          fi
          npx cap sync ios
      - name: pod install
        script: |
          cd capacitor/ios/App
          pod install
      - name: เตรียม keychain
        script: keychain initialize
      - name: สร้าง/ดึง signing files (สร้าง cert + profile ให้เองถ้ายังไม่มี)
        script: |
          if [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "✅ ใช้ private key เดิมจาก env var"
            printf '%s' "$CERTIFICATE_PRIVATE_KEY" > /tmp/cert_key.pem
          else
            echo "ℹ️ ยังไม่มี CERTIFICATE_PRIVATE_KEY — สร้างใหม่"
            openssl genrsa -out /tmp/cert_key.pem 2048
            echo ""
            echo "==================== คัดลอกคีย์ข้างล่างนี้ ===================="
            echo "เอาไปใส่เป็น env var ชื่อ CERTIFICATE_PRIVATE_KEY (ติ๊ก Secure, group appstore)"
            echo "เพื่อให้บิลด์ครั้งต่อไปใช้ certificate เดิม ไม่สร้างใหม่ทุกรอบ"
            echo "=============================================================="
            cat /tmp/cert_key.pem
            echo "=============================================================="
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
      - name: ใส่ cert เข้า keychain
        script: keychain add-certificates
      - name: ตั้ง build number
        script: |
          cd capacitor/ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          [ -z "$LATEST" ] && LATEST=0
          agvtool new-version -all $((LATEST + 1)) || echo "⚠️ ตั้ง build number ไม่สำเร็จ — ใช้ค่าเดิม"
      - name: บิลด์ ipa
        script: |
          cd capacitor/ios/App
          xcode-project use-profiles
          xcode-project build-ipa --workspace "App.xcworkspace" --scheme "App"
    artifacts:
      - capacitor/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # เปิดบรรทัดล่างเมื่อพร้อมส่งขึ้นขายจริง
        # submit_to_app_store: false
      email:
        recipients:
          - admin@onevela.net
        notify:
          success: true
          failure: true
