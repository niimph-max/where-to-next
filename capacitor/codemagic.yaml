# Codemagic — build iOS บนคลาวด์ (ไม่ต้องมี Mac)
# วิธีใช้: สมัคร codemagic.io → เชื่อม GitHub repo นี้ → เลือก workflow ด้านล่าง
# ต้องมีบัญชี Apple Developer ($99/ปี) และตั้ง App Store Connect API key ใน Codemagic ก่อน

workflows:
  ios-vela:
    name: Vela iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: capacitor

    environment:
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "net.onevela.app"
        XCODE_SCHEME: "App"
      # ตั้งค่าเหล่านี้ในหน้า Codemagic → Teams → Integrations
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.onevela.app

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: ติดตั้ง dependencies
        script: npm install

      - name: สร้างโปรเจกต์ iOS
        script: |
          if [ ! -d "ios" ]; then npx cap add ios; fi
          npx cap sync ios

      - name: ติดตั้ง CocoaPods
        script: |
          cd ios/App
          pod install

      - name: ตั้งค่า signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - niimph@gmail.com
        notify:
          success: true
          failure: true
      # ส่งเข้า TestFlight อัตโนมัติ — ติดตั้งลง iPhone ตัวเองได้เลย
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
